name: Source Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: read

jobs:
  validate-sources:
    name: Validate source freshness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate source metadata
        run: python3 scripts/validate_source_quality.py

      - name: Check external source reachability
        run: python3 scripts/validate_external_source_links.py --jobs 16 --retries 2 --timeout 15
